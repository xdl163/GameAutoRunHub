<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务操作日志 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
    <link rel="stylesheet" href="/static/task-logs.css" />

  </head>
  <body data-active-key="task_logs" data-log-endpoint="/api/logs/task" data-required-roles="admin,super_admin">
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>任务操作日志</h2>
            <div class="actions">
              <button id="refresh-logs" class="ghost">刷新</button>
            </div>
          </header>
          <div class="panel-body">
            <div class="card table-card">
              <div class="table-scroll">
                <table class="simple-table">
                  <thead>
                  <tr>
                    <th style="width: 160px">时间</th>
                    <th>操作人</th>
                    <th>操作</th>
                    <th>详情</th>
                  </tr>
                  </thead>
                  <tbody id="log-rows"></tbody>
                </table>
              </div>
              <div class="table-footer">
                <div class="pagination">
                  <button type="button" id="prev-page" class="ghost">上一页</button>
                  <span id="pagination-info" class="muted"></span>
                  <button type="button" id="next-page" class="ghost">下一页</button>
                </div>
              </div>
            </div>


          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/static/console.js"></script>
    <script type="module" src="/static/logs.js"></script>
  </body>
</html>
