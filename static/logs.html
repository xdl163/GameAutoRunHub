<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志中心 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>账户操作日志</h2>
            <p class="muted">展示登录、登出、创建、启停、删除、重置密码、角色调整等账户操作记录</p>
            <div class="actions">
              <button id="refresh-logs" class="ghost">刷新</button>
            </div>
          </header>
          <div class="panel-body">
            <div class="card table-card">
              <table class="simple-table">
                <thead>
                  <tr>
                    <th style="width: 160px">时间</th>
                    <th>操作人</th>
                    <th>目标账户</th>
                    <th>操作</th>
                    <th>详情</th>
                  </tr>
                </thead>
                <tbody id="log-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/console.js"></script>
    <script src="/static/logs.js"></script>
  </body>
</html>
