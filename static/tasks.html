<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务管理 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header panel-actions">
            <div>
              <h2>任务管理</h2>
              <p class="muted">分组化管理三类任务，支持跨角色查看、排序与操作日志</p>
            </div>
            <div class="row-actions">
              <button id="create-group-btn" class="ghost">新建分组</button>
              <button id="create-task-btn" class="primary">新建任务</button>
            </div>
          </header>
          <div class="panel-body task-layout">
            <aside class="task-sidebar">
              <div class="card group-card">
                <header class="card-header">
                  <div>
                    <strong>分组</strong>
                  </div>
                  <button id="group-refresh" class="ghost mini">刷新</button>
                </header>
                <div id="group-list" class="group-list"></div>
              </div>
            </aside>

            <section class="task-main">
              <div class="card filters-card">
                <div class="filter-row">
                  <div class="field inline" id="owner-filter-field">
                    <span>查看范围</span>
                    <select id="owner-filter">
                      <option value="all">全部员工</option>
                    </select>
                  </div>
                  <div class="field inline">
                    <span>排序</span>
                    <select id="task-sort">
                      <option value="updated_desc">按更新时间（新→旧）</option>
                      <option value="status">按状态</option>
                      <option value="type">按类型</option>
                      <option value="start_time">按开始时间</option>
                    </select>
                  </div>
                  <div class="pill-group" id="group-filter"></div>
                  <div class="pill-group" id="type-filter"></div>
                </div>
              </div>

              <div class="task-grid" id="task-grid"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="group-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>新建分组</h3>
          <button class="close-btn" data-close="#group-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>分组名称</span>
            <input type="text" id="group-name" placeholder="必填" />
          </label>
          <label class="field">
            <span>分组描述</span>
            <input type="text" id="group-desc" placeholder="用于标记职责/场景" />
          </label>
          <label class="field" id="group-owner-field">
            <span>所属员工</span>
            <input type="text" id="group-owner" placeholder="默认当前用户，可指定可管理人" />
          </label>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-group" class="primary" type="button">保存分组</button>
          </div>
        </div>
      </div>
    </div>

    <div id="task-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>新建任务</h3>
          <button class="close-btn" data-close="#task-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>任务名称</span>
            <input type="text" id="task-name" placeholder="示例：晨跑灵光积分" />
          </label>
          <label class="field">
            <span>任务类型</span>
            <select id="task-type">
              <option value="score">灵光积分</option>
              <option value="multiplier">挂机倍率</option>
              <option value="chest">宝箱</option>
            </select>
          </label>
          <label class="field">
            <span>所属分组</span>
            <select id="task-group"></select>
          </label>
          <label class="field" id="task-owner-field">
            <span>所属员工</span>
            <input type="text" id="task-owner" placeholder="默认当前用户" />
          </label>
          <label class="field">
            <span>绑定设备</span>
            <input type="text" id="task-device" placeholder="设备ID，可空表示待绑定" />
          </label>
          <label class="field">
            <span>开始时间</span>
            <input type="datetime-local" id="task-start" />
          </label>
          <div class="type-section" data-type="score">
            <div class="two-columns">
              <label class="field">
                <span>积分速率（每小时）</span>
                <input type="number" id="task-score-rate" value="7000" />
              </label>
              <label class="field">
                <span>目标积分</span>
                <input type="number" id="task-score-target" value="360000" />
              </label>
            </div>
            <label class="field">
              <span>当前积分</span>
              <input type="number" id="task-score-current" value="0" />
            </label>
          </div>
          <div class="type-section" data-type="multiplier">
            <div class="two-columns">
              <label class="field">
                <span>时长（小时）</span>
                <input type="number" id="task-multiplier-duration" value="12" />
              </label>
              <label class="field">
                <span>当前倍率</span>
                <input type="number" step="0.1" id="task-multiplier-current" value="1.0" />
              </label>
            </div>
          </div>
          <div class="type-section" data-type="chest">
            <label class="field">
              <span>时长（小时）</span>
              <input type="number" id="task-chest-duration" value="12" />
            </label>
          </div>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-task" class="primary" type="button">创建任务</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/console.js"></script>
    <script src="/static/tasks.js"></script>
  </body>
</html>
