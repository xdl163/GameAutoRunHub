<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务管理 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>任务管理</h2>
            <p class="muted">默认页面，展示最近的任务占位列表</p>
          </header>
          <div class="panel-body">
            <table class="simple-table">
              <thead>
                <tr>
                  <th>任务ID</th>
                  <th>名称</th>
                  <th>状态</th>
                  <th>最后更新</th>
                </tr>
              </thead>
              <tbody id="task-rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/console.js"></script>
    <script src="/static/tasks.js"></script>
  </body>
</html>
