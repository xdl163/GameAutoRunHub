<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务管理 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header panel-actions">
            <div>
              <h2>任务管理</h2>
            </div>
            <div class="row-actions">
              <button id="create-group-btn" class="ghost">新建分组</button>
              <button id="create-task-btn" class="primary">新建任务</button>
            </div>
          </header>
          <div class="panel-body task-layout">
            <aside class="task-sidebar">
              <div class="card group-card">
                <header class="card-header">
                  <div>
                    <strong>分组</strong>
                  </div>
                  <button id="group-refresh" class="ghost mini">刷新</button>
                </header>
                <div id="group-list" class="group-list"></div>
              </div>
            </aside>

            <section class="task-main">
              <div class="card filters-card">
                <div class="filter-row">
                  <div class="field inline" id="owner-filter-field">
                    <span>查看范围</span>
                    <select id="owner-filter">
                      <option value="all">全部员工</option>
                    </select>
                  </div>
                  <div class="field inline">
                    <span>排序</span>
                    <select id="task-sort">
                      <option value="updated_desc">按更新时间（新→旧）</option>
                      <option value="status">按状态</option>
                      <option value="type">按类型</option>
                      <option value="start_time">按开始时间</option>
                    </select>
                  </div>
                  <div class="pill-group" id="status-filter"></div>
                  <div class="pill-group" id="type-filter"></div>
                </div>
              </div>

              <div class="task-grid" id="task-grid"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="group-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>新建分组</h3>
          <button class="close-btn" data-close="#group-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>分组名称</span>
            <input type="text" id="group-name" placeholder="必填" />
          </label>
          <label class="field">
            <span>分组描述</span>
            <input type="text" id="group-desc" placeholder="用于标记职责/场景" />
          </label>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-group" class="primary" type="button">保存分组</button>
          </div>
        </div>
      </div>
    </div>

    <div id="task-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>新建任务</h3>
          <button class="close-btn" data-close="#task-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>任务名称</span>
            <input type="text" id="task-name" placeholder="示例：晨跑灵光积分" />
          </label>
          <div class="field">
            <span>任务类型</span>
            <div class="pill-group type-toggle" id="task-type-buttons">
              <button type="button" class="pill" data-type="score">灵光积分</button>
              <button type="button" class="pill" data-type="multiplier">挂机倍率</button>
              <button type="button" class="pill" data-type="chest">宝箱</button>
            </div>
          </div>
          <label class="field inline-field">
            <span>所属分组</span>
            <select id="task-group"></select>
          </label>
          <label class="field">
            <span>绑定设备</span>
            <input type="text" id="task-device" placeholder="设备ID（必填）" autocomplete="off" />
            <div id="task-device-suggest" class="suggestion-list"></div>
          </label>
          <label class="field inline-field">
            <span>开始时间</span>
            <input type="datetime-local" id="task-start" />
          </label>
          <div class="type-section" data-type="score">
            <label class="field">
              <span>目标积分</span>
              <div class="input-with-actions inline-actions">
                <input type="number" id="task-score-target" value="360000" />
                <div class="quick-actions">
                  <button type="button" class="quick-btn" data-target-input="task-score-target" data-increment="100000">+10w</button>
                  <button type="button" class="quick-btn" data-target-input="task-score-target" data-increment="50000">+5w</button>
                  <button type="button" class="quick-btn" data-target-input="task-score-target" data-increment="10000">+1w</button>
                </div>
              </div>
            </label>
            <div class="two-columns">
              <label class="field">
                <span>当前积分</span>
                <input type="number" id="task-score-current" value="0" />
              </label>
              <label class="field">
                <span>积分速率（每小时）</span>
                <input type="number" id="task-score-rate" value="7000" />
              </label>
            </div>
          </div>
          <div class="type-section" data-type="multiplier">
            <div class="two-columns">
              <label class="field">
                <span>时长（小时）</span>
                <div class="input-with-actions">
                  <input type="number" id="task-multiplier-duration" value="12" />
                  <div class="quick-actions">
                    <button type="button" class="quick-btn" data-target-input="task-multiplier-duration" data-increment="12">+12h</button>
                    <button type="button" class="quick-btn" data-target-input="task-multiplier-duration" data-increment="24">+24h</button>
                  </div>
                </div>
              </label>
              <label class="field">
                <span>当前倍率</span>
                <input type="number" step="0.1" id="task-multiplier-current" value="1.0" />
              </label>
            </div>
          </div>
          <div class="type-section" data-type="chest">
            <label class="field">
              <span>时长（小时）</span>
              <div class="input-with-actions">
                <input type="number" id="task-chest-duration" value="12" />
                <div class="quick-actions">
                  <button type="button" class="quick-btn" data-target-input="task-chest-duration" data-increment="12">+12h</button>
                  <button type="button" class="quick-btn" data-target-input="task-chest-duration" data-increment="24">+24h</button>
                </div>
              </div>
            </label>
          </div>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-task" class="primary" type="button">创建任务</button>
          </div>
        </div>
      </div>
    </div>

    <div id="patch-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>补暂停 / 补积分</h3>
          <button class="close-btn" data-close="#patch-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <p class="muted" id="patch-task-name"></p>
          <div class="field" id="patch-points-field">
            <span>积分（仅灵光积分）</span>
            <input type="number" id="patch-points" placeholder="输入积分" />
          </div>
          <div class="field">
            <span>补充时长（小时）</span>
            <input type="number" id="patch-hours" placeholder="输入小时数" />
          </div>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-patch" class="primary" type="button">提交</button>
          </div>
        </div>
      </div>
    </div>

    <div id="edit-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>修改任务</h3>
          <button class="close-btn" data-close="#edit-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <p class="muted" id="edit-task-name"></p>
          <div class="field">
            <span>绑定设备</span>
            <input type="text" id="edit-device" placeholder="设备ID，可空表示待绑定" autocomplete="off" />
            <div id="edit-device-suggest" class="suggestion-list"></div>
          </div>
          <div class="type-section" data-type="score">
            <div class="two-columns">
              <label class="field">
                <span>目标积分</span>
                <div class="input-with-actions inline-actions">
                  <input type="number" id="edit-score-target" />
                  <div class="quick-actions">
                    <button type="button" class="quick-btn" data-target-input="edit-score-target" data-increment="100000">+10w</button>
                    <button type="button" class="quick-btn" data-target-input="edit-score-target" data-increment="50000">+5w</button>
                    <button type="button" class="quick-btn" data-target-input="edit-score-target" data-increment="10000">+1w</button>
                  </div>
                </div>
              </label>
              <label class="field">
                <span>积分速率</span>
                <input type="number" id="edit-score-rate" />
              </label>
            </div>
          </div>
          <div class="type-section" data-type="multiplier">
            <label class="field">
              <span>时长（小时）</span>
              <div class="input-with-actions">
                <input type="number" id="edit-multiplier-hours" />
                <div class="quick-actions">
                  <button type="button" class="quick-btn" data-target-input="edit-multiplier-hours" data-increment="12">+12h</button>
                  <button type="button" class="quick-btn" data-target-input="edit-multiplier-hours" data-increment="24">+24h</button>
                </div>
              </div>
            </label>
            <label class="field">
              <span>当前倍率</span>
              <input type="number" step="0.1" id="edit-multiplier-current" />
            </label>
          </div>
          <div class="type-section" data-type="chest">
            <label class="field">
              <span>时长（小时）</span>
              <div class="input-with-actions">
                <input type="number" id="edit-chest-hours" />
                <div class="quick-actions">
                  <button type="button" class="quick-btn" data-target-input="edit-chest-hours" data-increment="12">+12h</button>
                  <button type="button" class="quick-btn" data-target-input="edit-chest-hours" data-increment="24">+24h</button>
                </div>
              </div>
            </label>
          </div>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-edit" class="primary" type="button">保存修改</button>
          </div>
        </div>
      </div>
    </div>

    <div id="move-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>移动任务分组</h3>
          <button class="close-btn" data-close="#move-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <p class="muted" id="move-task-name"></p>
          <label class="field">
            <span>目标分组</span>
            <select id="move-group-select"></select>
          </label>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-move" class="primary" type="button">确认移动</button>
          </div>
        </div>
      </div>
    </div>

    <div id="group-manage-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>管理分组</h3>
          <button class="close-btn" data-close="#group-manage-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>分组名称</span>
            <input type="text" id="manage-group-name" />
          </label>
          <label class="field">
            <span>分组描述</span>
            <input type="text" id="manage-group-desc" />
          </label>
          <label class="field">
            <span>可访问成员</span>
            <div id="manage-access-current" class="pill-group selectable-list"></div>
            <button type="button" class="ghost mini" id="open-access-modal">修改成员</button>
            <p class="muted mini">默认仅自己可访问，修改后可选择其他成员</p>
          </label>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-group-manage" class="primary" type="button">保存</button>
          </div>
        </div>
      </div>
    </div>

    <div id="access-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>选择可访问成员</h3>
          <button class="close-btn" data-close="#access-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <label class="field">
            <span>搜索成员</span>
            <input type="text" id="access-modal-search" placeholder="输入用户名或姓名筛选" />
          </label>
          <div id="access-modal-list" class="pill-group selectable-list"></div>
          <div class="actions" style="justify-content: flex-end">
            <button id="submit-access-modal" class="primary" type="button">完成选择</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/console.js"></script>
    <script src="/static/tasks.js"></script>
  </body>
</html>
