<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameAutoRunHub 控制台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="login-view" class="card">
        <h1>登录 GameAutoRunHub</h1>
        <p class="muted">
          默认超级管理员：<strong>admin</strong> / <strong>xu12345678gh</strong>
        </p>
        <label class="field">
          <span>用户名</span>
          <input id="username" type="text" placeholder="请输入用户名" />
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" type="password" placeholder="请输入密码" />
        </label>
        <label class="field">
          <span>角色</span>
          <select id="role">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
            <option value="super_admin">超级管理员</option>
          </select>
        </label>
        <button id="login-btn" class="primary">登录</button>
        <p id="login-error" class="error"></p>
      </section>

      <section id="console" class="hidden">
        <header class="topbar">
          <div class="topbar-left">
            <div id="user-info"></div>
            <div id="clock"></div>
          </div>
          <div class="topbar-actions">
            <button id="change-password-btn" class="ghost">修改密码</button>
            <button id="logout-btn" class="ghost">退出登录</button>
          </div>
        </header>

        <div class="layout">
          <aside class="sidebar">
            <nav id="menu"></nav>
          </aside>
          <main class="content">
            <section id="tasks" class="panel active">
              <header class="panel-header">
                <h2>任务管理</h2>
                <p class="muted">默认页面，展示最近的任务占位列表</p>
              </header>
              <div class="panel-body">
                <table class="simple-table">
                  <thead>
                    <tr>
                      <th>任务ID</th>
                      <th>名称</th>
                      <th>状态</th>
                      <th>最后更新</th>
                    </tr>
                  </thead>
                  <tbody id="task-rows"></tbody>
                </table>
              </div>
            </section>

            <section id="devices" class="panel">
              <header class="panel-header">
                <h2>设备池</h2>
                <p class="muted">设备池页面占位内容</p>
              </header>
              <div class="panel-body placeholder">功能待接入</div>
            </section>

            <section id="users" class="panel">
              <header class="panel-header">
                <h2>用户管理</h2>
                <p class="muted">管理员及以上可见，支持添加与浏览用户</p>
              </header>
              <div class="panel-body split">
                <form id="user-form" class="card">
                  <label class="field">
                    <span>用户名</span>
                    <input id="new-username" type="text" placeholder="唯一用户名" />
                  </label>
                  <label class="field">
                    <span>显示名称</span>
                    <input id="new-display" type="text" placeholder="昵称/姓名" />
                  </label>
                  <label class="field">
                    <span>密码</span>
                    <input id="new-password" type="password" placeholder="初始密码" />
                  </label>
                  <label class="field">
                    <span>角色</span>
                    <select id="new-role">
                      <option value="user">普通用户</option>
                      <option value="admin">管理员</option>
                      <option value="super_admin">超级管理员</option>
                    </select>
                  </label>
                  <button type="button" id="add-user" class="primary">创建用户</button>
                  <p id="user-form-error" class="error"></p>
                </form>

                <div class="card table-card">
                  <table class="simple-table">
                    <thead>
                      <tr>
                        <th>用户名</th>
                        <th>显示名称</th>
                        <th>角色</th>
                        <th>状态</th>
                      </tr>
                    </thead>
                    <tbody id="user-rows"></tbody>
                  </table>
                </div>
              </div>
            </section>

            <section id="logs" class="panel">
              <header class="panel-header">
                <h2>日志中心</h2>
                <p class="muted">展示任务、设备池与账户操作日志的占位区域</p>
              </header>
              <div class="panel-body placeholder">日志列表待接入</div>
            </section>

            <section id="system" class="panel">
              <header class="panel-header">
                <h2>系统配置</h2>
                <p class="muted">超级管理员可见的平台级配置 &amp; 全局参数</p>
              </header>
              <div class="panel-body placeholder">配置项待接入</div>
            </section>

            <section id="account" class="panel">
              <header class="panel-header">
                <h2>账户设置</h2>
                <p class="muted">修改自己的密码</p>
              </header>
              <div class="panel-body">
                <form id="self-password-form" class="card compact">
                  <label class="field">
                    <span>旧密码</span>
                    <input id="old-password" type="password" placeholder="请输入旧密码" />
                  </label>
                  <label class="field">
                    <span>新密码</span>
                    <input id="new-self-password" type="password" placeholder="请输入新密码" />
                  </label>
                  <button type="button" id="update-self-password" class="primary">更新密码</button>
                  <p id="self-password-msg" class="success"></p>
                </form>
              </div>
            </section>
          </main>
        </div>
      </section>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
