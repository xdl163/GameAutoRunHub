<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备池 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>设备池</h2>
            <p class="muted">管理设备生命周期、查询空闲设备并按条件检索</p>
          </header>
          <div class="panel-body">
            <div class="card form-grid">
              <div class="field inline">
                <span>设备ID</span>
                <input id="filter-device-id" type="text" placeholder="模糊匹配设备ID" />
              </div>
              <div class="field inline">
                <span>任务ID</span>
                <input id="filter-task-id" type="number" placeholder="绑定的任务ID" />
              </div>
              <div class="field inline">
                <span>状态</span>
                <select id="filter-status">
                  <option value="">全部状态</option>
                  <option value="idle">空闲</option>
                  <option value="running">运行中</option>
                  <option value="shutdown">已关机</option>
                  <option value="error">异常</option>
                </select>
              </div>
              <label class="field inline checkbox-field">
                <input id="filter-idle-only" type="checkbox" /> 仅显示空闲
              </label>
              <div class="actions">
                <button type="button" id="search-devices">搜索</button>
                <button type="button" id="reset-filters" class="ghost">重置</button>
              </div>
            </div>

            <div class="card">
              <header class="card-header">
                <strong>新建设备</strong>
              </header>
              <div class="card-body form-grid">
                <div class="field inline">
                  <span>设备ID</span>
                  <input id="new-device-id" type="text" placeholder="唯一设备ID" />
                </div>
                <div class="field inline">
                  <span>平台</span>
                  <select id="new-device-platform">
                    <option value="android">Android</option>
                    <option value="ios">iOS</option>
                    <option value="emulator">模拟器</option>
                  </select>
                </div>
                <div class="field inline">
                  <span>备注</span>
                  <input id="new-device-remark" type="text" placeholder="备注信息" />
                </div>
                <div class="field inline">
                  <span>配置</span>
                  <input id="new-device-config" type="text" placeholder="CPU/内存/型号等" />
                </div>
                <div class="actions">
                  <button type="button" id="create-device" class="primary">创建</button>
                  <p id="device-form-error" class="error" style="margin: 0"></p>
                </div>
              </div>
            </div>

            <div class="card table-card">
              <header class="card-header" style="display: flex; justify-content: space-between; align-items: center">
                <strong>设备列表</strong>
                <span class="muted" id="device-summary"></span>
              </header>
              <table class="simple-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>设备ID</th>
                    <th>平台</th>
                    <th>状态</th>
                    <th>备注</th>
                    <th>配置</th>
                    <th>更新时间</th>
                    <th style="width: 200px">操作</th>
                  </tr>
                </thead>
                <tbody id="device-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="device-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>编辑设备</h3>
          <button class="close-btn" id="close-device-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <div class="field inline">
            <span>平台</span>
            <select id="edit-platform">
              <option value="android">Android</option>
              <option value="ios">iOS</option>
              <option value="emulator">模拟器</option>
            </select>
          </div>
          <div class="field inline">
            <span>状态</span>
            <select id="edit-status">
              <option value="idle">空闲</option>
              <option value="running">运行中</option>
              <option value="shutdown">已关机</option>
              <option value="error">异常</option>
            </select>
          </div>
          <div class="field inline">
            <span>备注</span>
            <input id="edit-remark" type="text" />
          </div>
          <div class="field inline">
            <span>配置</span>
            <input id="edit-config" type="text" />
          </div>
          <p id="edit-error" class="error" style="margin: 0"></p>
          <div class="actions" style="justify-content: flex-end">
            <button type="button" id="save-device" class="primary">保存修改</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/console.js"></script>
    <script src="/static/devices.js"></script>
  </body>
</html>
