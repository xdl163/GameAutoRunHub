<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备池 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
    <link rel="stylesheet" href="/static/devices.css" />

  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>设备池</h2>
          </header>
          <div class="panel-body">
            <div class="card search-row">
              <div class="field inline">
                <span>设备ID</span>
                <input id="filter-device-id" type="text" placeholder="模糊匹配设备ID" />
              </div>
              <div class="field inline" id="filter-username-field">
                <span>用户名</span>
                <select id="filter-username">
                  <option value="">全部用户</option>
                </select>
              </div>

              <div class="field inline">
                <span>任务ID</span>
                <input id="filter-task-id" type="number" placeholder="绑定的任务ID" />
              </div>
              <div class="field inline">
                <span>状态</span>
                <select id="filter-status">
                  <option value="">全部状态</option>
                  <option value="idle">空闲</option>
                  <option value="running">运行中</option>
                  <option value="shutdown">已关机</option>
                  <option value="error">异常</option>
                </select>
              </div>
              <div class="actions">
                <button type="button" id="search-devices">搜索</button>
                <button type="button" id="reset-filters" class="ghost">重置</button>
              </div>
            </div>

            <div class="card table-card">
              <header class="card-header" style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <strong>设备列表</strong>
                  <span class="muted" id="device-summary"></span>
                </div>
                <button type="button" id="open-create-modal" class="primary">新建设备</button>
              </header>

              <div class="table-scroll">
                <table class="simple-table">
                  <thead>
                  <tr>
                    <th>设备ID</th>
                    <th>所属用户</th>
                    <th>平台</th>
                    <th>状态</th>
                    <th>备注</th>
                    <th>配置</th>
                    <th>更新时间</th>
                    <th style="width: 200px">操作</th>
                  </tr>
                  </thead>
                  <tbody id="device-rows"></tbody>
                </table>
              </div>
              <div class="table-footer">
                <div class="pagination">
                  <button type="button" id="prev-page" class="ghost">上一页</button>
                  <span id="pagination-info" class="muted"></span>
                  <button type="button" id="next-page" class="ghost">下一页</button>
                </div>
              </div>
            </div>

          </div>
        </section>
      </main>
    </div>

    <div id="device-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>编辑设备</h3>
          <button class="close-btn" id="close-device-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <div class="field inline">
            <span>平台</span>
            <select id="edit-platform">
              <option value="android">Android</option>
              <option value="ios">iOS</option>
              <option value="emulator">模拟器</option>
            </select>
          </div>
          <div class="field inline">
            <span>状态</span>
            <select id="edit-status">
              <option value="idle">空闲</option>
              <option value="running">运行中</option>
              <option value="shutdown">已关机</option>
              <option value="error">异常</option>
            </select>
          </div>
          <div class="field inline">
            <span>备注</span>
            <input id="edit-remark" type="text" />
          </div>
          <div class="field inline">
            <span>配置</span>
            <input id="edit-config" type="text" />
          </div>
          <p id="edit-error" class="error" style="margin: 0"></p>
          <div class="actions" style="justify-content: flex-end">
            <button type="button" id="save-device" class="primary">保存修改</button>
          </div>
        </div>
      </div>
    </div>

    <div id="create-modal" class="modal-backdrop">
      <div class="modal">
        <header>
          <h3>新建设备</h3>
          <button class="close-btn" id="close-create-modal">×</button>
        </header>
        <div class="modal-body form-grid">
          <div class="field inline">
            <span>设备ID</span>
            <input id="create-device-id" type="text" placeholder="唯一设备ID" />
          </div>
          <div class="field inline">
            <span>平台</span>
            <select id="create-device-platform">
              <option value="android">Android</option>
              <option value="ios">iOS</option>
              <option value="emulator">模拟器</option>
            </select>
          </div>
          <div class="field inline">
            <span>备注</span>
            <input id="create-device-remark" type="text" placeholder="备注信息" />
          </div>
          <div class="field inline">
            <span>配置</span>
            <input id="create-device-config" type="text" placeholder="CPU/内存/型号等" />
          </div>
          <p id="create-device-error" class="error" style="margin: 0"></p>
          <div class="actions" style="justify-content: flex-end">
            <button type="button" id="submit-create-device" class="primary">创建</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/console.js"></script>
    <script type="module" src="/static/devices.js"></script>
  </body>
</html>
