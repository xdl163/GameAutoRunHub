<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账户设置 - GameAutoRunHub</title>
    <link rel="stylesheet" href="/static/console.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div id="user-info"></div>
        <div id="clock"></div>
      </div>
      <div class="topbar-actions">
        <button id="change-password-btn" class="ghost">修改密码</button>
        <button id="logout-btn" class="ghost">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main class="content">
        <section class="panel">
          <header class="panel-header">
            <h2>账户设置</h2>
            <p class="muted">修改自己的密码</p>
          </header>
          <div class="panel-body">
            <form id="self-password-form" class="card compact">
              <label class="field">
                <span>旧密码</span>
                <input id="old-password" type="password" placeholder="请输入旧密码" />
              </label>
              <label class="field">
                <span>新密码</span>
                <input id="new-self-password" type="password" placeholder="请输入新密码" />
              </label>
              <button type="button" id="update-self-password" class="primary">更新密码</button>
              <p id="self-password-msg" class="success"></p>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/static/console.js"></script>
    <script type="module" src="/static/account.js"></script>
  </body>
</html>
