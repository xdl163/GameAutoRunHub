services:
  app:
    image: gameautorunhub:v1.0
    container_name: gameautorunhub_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8055:8000"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: mysql:8.0
    container_name: gameautorunhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-game_auto_run_hub}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
